<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- ======================================================================
       SEÇÃO 1: CABEÇALHO, METADADOS E FONTES
       Define o título da página, responsividade no celular e fontes natalinas.
  ====================================================================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amigo Secreto da Chácara 🎄</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- ======================================================================
       SEÇÃO 2: ESTILOS VISUAIS E ANIMAÇÕES (CSS)
       Controla cores natalinas, neve caindo, pisca-pisca sequencial e cartões.
  ====================================================================== -->
  <style>
    :root {
      --bg-dark: #071911;
      --bg-card: rgba(13, 39, 27, 0.90);
      --border-gold: rgba(245, 197, 66, 0.35);
      --gold: #f5c542;
      --gold-light: #ffe38f;
      --red: #d92b3a;
      --red-dark: #9e1925;
      --green: #1ea866;
      --text-main: #f8faf9;
      --text-muted: #b8cfc2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top, #133c29 0%, #081c13 55%, #040f0a 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 60px;
    }

    /* Flocos de neve animados */
    .snow-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .snowflake {
      position: absolute;
      top: -20px;
      color: rgba(255, 255, 255, 0.72);
      user-select: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0%   { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.85; }
      90%  { opacity: 0.85; }
      100% { transform: translateY(105vh) translateX(25px) rotate(360deg); opacity: 0; }
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 18px;
      position: relative;
      z-index: 2;
    }

    /* Cabeçalho e Árvore com Pisca-Pisca Sequencial */
    header { text-align: center; padding: 8px 0 22px; }

    .tree-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
      filter: drop-shadow(0 12px 26px rgba(0, 0, 0, 0.55));
    }
    .christmas-tree { width: 165px; height: 200px; overflow: visible; }

    .star-top {
      transform-origin: 100px 22px;
      animation: starPulse 2s ease-in-out infinite;
    }
    @keyframes starPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #ffd700); }
      50%      { transform: scale(1.16); filter: drop-shadow(0 0 18px #fff2a6); }
    }

    .bulb {
      animation: seqBlink 2.4s infinite ease-in-out;
      animation-delay: calc(var(--seq) * 0.16s);
    }
    @keyframes seqBlink {
      0%, 100% { opacity: 0.3; transform: scale(0.88); }
      25%, 45% { opacity: 1; transform: scale(1.28); filter: drop-shadow(0 0 9px currentColor); }
    }

    .badge-natal {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(217, 43, 58, 0.24);
      border: 1px solid rgba(245, 197, 66, 0.5);
      color: var(--gold-light);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* Título 100% responsivo (não corta em celulares nem computadores) */
    h1.main-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.55rem, 4.3vw, 3.05rem);
      font-weight: 900;
      line-height: 1.2;
      padding: 0 8px;
      background: linear-gradient(135deg, #fff3b8 0%, #f5c542 50%, #e09f1f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px rgba(245, 197, 66, 0.22);
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.96rem;
      max-width: 630px;
      margin: 0 auto 14px;
      line-height: 1.55;
    }

    .info-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
    }
    .pill {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-gold);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--gold-light);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .status-online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .status-warn   { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }

    /* Abas de Navegação */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 22px 0;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text-muted);
      padding: 11px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
    .tab-btn.active {
      background: linear-gradient(135deg, #f5c542, #d49b1a);
      color: #1c1402;
      border-color: #ffe38f;
      box-shadow: 0 6px 20px rgba(245, 197, 66, 0.32);
    }

    /* Cartões e Formulários */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 20px;
      padding: 26px;
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 1.32rem;
      color: var(--gold-light);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card p.desc {
      color: var(--text-muted);
      font-size: 0.91rem;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .guide-box {
      background: rgba(245, 197, 66, 0.08);
      border: 1px solid rgba(245, 197, 66, 0.32);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 18px;
      font-size: 0.88rem;
      line-height: 1.55;
      color: #f4f7f5;
    }
    .guide-box strong { color: var(--gold-light); }

    .form-group { margin-bottom: 15px; }
    label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(4, 18, 12, 0.88);
      color: #fff;
      font-family: inherit;
      font-size: 0.96rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245, 197, 66, 0.18);
    }

    /* Botões */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.96rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      width: 100%;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      color: #fff;
      box-shadow: 0 8px 22px rgba(217, 43, 58, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 10px 28px rgba(217, 43, 58, 0.6); }
    .btn-gold {
      background: linear-gradient(135deg, #f5c542, #d49b1a);
      color: #1d1402;
      box-shadow: 0 8px 22px rgba(245, 197, 66, 0.3);
    }
    .btn-green {
      background: linear-gradient(135deg, #1ea866, #137a48);
      color: #fff;
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
    }
    .btn-sm { width: auto; padding: 8px 13px; font-size: 0.82rem; border-radius: 9px; }

    /* Chip de exemplos de presente */
    .example-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 8px 0 12px;
    }
    .chip-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(245, 197, 66, 0.3);
      color: var(--gold-light);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: inherit;
    }
    .chip-btn:hover { background: rgba(245, 197, 66, 0.2); }

    /* Bloco de Destaque da Dica Obrigatória */
    .dica-required-box {
      background: rgba(217, 43, 58, 0.14);
      border: 2px solid rgba(245, 197, 66, 0.55);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      transition: all 0.25s ease;
    }
    .dica-required-box.ok {
      background: rgba(30, 168, 102, 0.12);
      border-color: rgba(30, 168, 102, 0.55);
    }
    .dica-required-box.shake {
      animation: shakeAnim 0.45s ease;
      border-color: #ff4d5e;
      box-shadow: 0 0 22px rgba(217, 43, 58, 0.45);
    }
    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }

    /* Bloqueio de visualização de resultado até preencher dica */
    .locked-result-box {
      background: rgba(217, 43, 58, 0.16);
      border: 2px dashed rgba(245, 197, 66, 0.65);
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      margin-top: 14px;
    }

    /* Cartão de Revelação do Amigo Secreto */
    .reveal-box {
      background: linear-gradient(145deg, rgba(217, 43, 58, 0.24), rgba(245, 197, 66, 0.16));
      border: 2px solid var(--gold);
      border-radius: 18px;
      padding: 24px 20px;
      text-align: center;
      margin-top: 14px;
      position: relative;
      overflow: hidden;
    }
    .reveal-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--gold-light);
      font-weight: 700;
    }
    .reveal-name {
      font-family: 'Cinzel Decorative', serif;
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      margin: 10px 0;
      text-shadow: 0 0 18px rgba(245, 197, 66, 0.6);
    }
    .wishlist-tag {
      display: inline-block;
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      color: #e9f5ee;
      margin-top: 8px;
      max-width: 100%;
    }

    /* Lista da Família (Sem Spoilers) */
    .member-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .member-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 14px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .member-info strong { display: block; font-size: 0.96rem; color: #fff; }
    .member-info span { font-size: 0.78rem; color: var(--text-muted); }

    .status-pill {
      padding: 4px 10px;
      border-radius: 999px
